  <body class="locked">
    <div id="intro" class="intro" aria-live="polite">
      <div class="fill"></div>
      <div class="stage" id="curtain-stage">
        <img class="plate" alt="" decoding="async" />
        <canvas class="gl" aria-hidden="true"></canvas>
        <div class="blk mono"><img alt="" /><div class="shine"></div></div>
        <canvas class="fx" aria-hidden="true"></canvas>
        <svg class="rope" aria-hidden="true"></svg>
        <button class="tassel-btn" type="button" aria-label="Open the invitation"></button>
        <div class="hint" aria-hidden="true"><span>Pull to open</span></div>
      </div>
      <div class="preloader" id="preloader">
        <div class="pre-mono"><img alt="" /><div class="shine"></div></div>
        <div class="pre-line"><i></i></div>
      </div>
    </div>

    <main id="scroller" aria-label="Invitation"></main>

    <button class="music" type="button" aria-label="Play music" aria-pressed="false" hidden>
      <span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      <svg class="mute" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 9.5h3.2L11.5 6v12l-4.3-3.5H4z" fill="currentColor" />
        <path d="M15 9.2l5 5.6M20 9.2l-5 5.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none" />
      </svg>
    </button>

    <noscript>
      <p class="noscript">Please enable JavaScript to open this invitation.</p>
    </noscript>
    <script type="module" src="/src/main.js"></script>
